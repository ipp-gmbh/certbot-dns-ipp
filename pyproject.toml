# File format documentation:
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html

[build-system]
requires = [
    "setuptools>=80",
    "setuptools_scm[simple]>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "certbot-dns-ipp"
description = "IP-Projects DNS Authenticator plugin for Certbot"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "certbot",
    "dns",
    "acme",
    "letsencrypt",
    "ip-projects"
]
authors = [
    { name = "Frank Ebner" },
    { name = "Markus Ebner" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "certbot>=2.7",
    "requests",
]

[project.urls]
"Source Code" = "https://github.com/ipp-gmbh/certbot-dns-ipp"
"Issue Tracker" = "https://github.com/ipp-gmbh/certbot-dns-ipp/issues"

[project.entry-points."certbot.plugins"]
dns-ipp = "certbot_dns_ipp.dns_ipp:Authenticator"
